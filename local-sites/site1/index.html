<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LiveChat Local Test Site 1</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 24px; }
      .card { max-width: 720px; border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
      code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Local Test Site 1</h1>
      <p>This page embeds the LiveChat bubble via <code>livechat-loader.js</code>.</p>
      <p>Origin: serve on port <code>3101</code> (recommended).</p>
    </div>

    <script>
      // IMPORTANT: Point this to your LiveChat app base URL.
      // If you run `php artisan serve --port 8000`, this should work as-is.
      window.BeChatSettings = {
        widgetDomain: "http://127.0.0.1:8000/livechat-loader.js",
        // Optional: route to a specific group/department.
        // department: 1,
      };

      window.BeChatReady = (api) => {
        api.onLoaded(() => console.log("BeChat loaded (site1)"));
      };
    </script>
    <script src="http://127.0.0.1:8000/livechat-loader.js"></script>
  </body>
</html>
